# Single-instance invite-only pilot. Complete PILOT.md before starting.
services:
  streamlit-web:
    build:
      context: .
      target: runtime
      args:
        VA_LSE_BUILD_SHA: ${VA_LSE_BUILD_SHA:?Set the reviewed immutable revision}
    command: [python, -m, app.pilot_server, --server.port=8501, --server.address=0.0.0.0, --server.headless=true, --server.disconnectedSessionTTL=60]
    env_file: ${VA_LSE_PILOT_ENV_FILE:?Set the operator environment file}
    environment:
      VA_LSE_MODE: controlled-pilot
      VA_LSE_PILOT_TEXT_EXPORTS: ${VA_LSE_PILOT_TEXT_EXPORTS:-0}
      VA_LSE_PILOT_APPROVAL_FILE: /run/pilot/approval.json
      VA_LSE_PILOT_BUDGET_FILE: /app/pilot-control/pilot-budget.sqlite3
      VA_LSE_MAX_RECORD_PAGES: "500"
      VA_LSE_JOB_QUEUE: "0"
      VA_LSE_BLOB_STORE: none
      VA_LSE_EXTRACTOR: isolated
      VA_LSE_PARSER_IMAGE: ${VA_LSE_PARSER_IMAGE:?Set the reviewed parser image ID sha256}
      VA_LSE_PARSER_ENGINE_ID: ${VA_LSE_PARSER_ENGINE_ID:?Set the reviewed dedicated parser engine ID}
      VA_LSE_TRACING: "0"
      VA_LSE_HEALTH_HOST: 127.0.0.1
      VA_LSE_LOG_JSON: "1"
      VA_LSE_LOG_DIR: /app/logs
      VA_LSE_AUDIT_LOG_DIR: /app/logs
      VA_LSE_RUN_LOG_DIR: /app/logs
      VA_LSE_PILOT_LOG_RETENTION_DAYS: ${VA_LSE_PILOT_LOG_RETENTION_DAYS:?Set the reviewed local log age limit}
      VA_LSE_AUDIT_BACKUP_DESTINATION: none
      VA_LSE_AUDIT_BACKUP_REQUIRED: "0"
      TMPDIR: /run/upload-tmp
      TEMP: /run/upload-tmp
      TMP: /run/upload-tmp
    volumes:
      - ${VA_LSE_PILOT_APPROVAL_HOST_FILE:?Set the reviewed approval file}:/run/pilot/approval.json:ro
      - ${VA_LSE_OIDC_SECRETS_FILE:?Set the OIDC secrets file}:/app/.streamlit/secrets.toml:ro
      - pilot-logs:/app/logs
      - pilot-control:/app/pilot-control
      - parser-channel:/run/parser:ro
    depends_on:
      parser-launcher:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
    mem_limit: 3g
    memswap_limit: 3g
    ulimits:
      core: 0
    cpus: 2
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp:size=256M,mode=1777
      - /run/upload-tmp:rw,noexec,nosuid,nodev,size=256M,mode=0700,uid=65534,gid=65534
    logging:
      driver: "none"
    restart: unless-stopped
  parser-launcher:
    build:
      context: .
      dockerfile: deploy/parser-launcher.Dockerfile
    environment:
      VA_LSE_PARSER_IMAGE: ${VA_LSE_PARSER_IMAGE:?Set the reviewed parser image ID sha256}
      VA_LSE_BUILD_SHA: ${VA_LSE_BUILD_SHA:?Set the reviewed immutable revision}
      VA_LSE_PARSER_MAX_PAGES: "500"
      VA_LSE_PARSER_ENGINE_ENDPOINT: ${VA_LSE_PARSER_ENGINE_ENDPOINT:?Set the private dedicated parser VM TLS endpoint}
      VA_LSE_PARSER_ENGINE_ID: ${VA_LSE_PARSER_ENGINE_ID:?Set the reviewed dedicated parser engine ID}
      VA_LSE_APPLICATION_ENGINE_ID: ${VA_LSE_APPLICATION_ENGINE_ID:?Set the application daemon ID for separation checks}
    volumes:
      - type: bind
        source: ${VA_LSE_PARSER_ENGINE_TLS_DIRECTORY:?Set the private parser-only client TLS directory}
        target: /run/parser-engine/tls
        read_only: true
        bind:
          create_host_path: false
      - parser-channel:/run/parser
    networks: [parser-engine]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    memswap_limit: 512m
    ulimits:
      core: 0
    cpus: 1
    pids_limit: 64
    tmpfs:
      - /tmp:size=16M,mode=1777
    healthcheck:
      test: [CMD, python, -c, "import socket; from app.parser_protocol import *; s=socket.socket(socket.AF_UNIX); s.settimeout(12); s.connect(SOCKET_PATH); s.sendall(frame(encode({'operation':'health'}))); assert decode(recv_frame(s, MAX_HEADER)).get('ready') is True"]
      interval: 90s
      timeout: 15s
      retries: 2
    logging:
      driver: "none"
    restart: unless-stopped
  nginx:
    build:
      context: .
      dockerfile: deploy/pilot-proxy.Dockerfile
    image: va-lse-pilot-proxy:${VA_LSE_BUILD_SHA:?Set the reviewed immutable revision}
    ports:
      - ${VA_LSE_BIND_IP:?Set the private ingress bind address}:443:8443
    volumes:
      - ./nginx/pilot.conf:/etc/nginx/nginx.conf:ro
      - ${VA_LSE_TLS_CERT:?Set the TLS certificate file}:/run/tls/cert.pem:ro
      - ${VA_LSE_TLS_KEY:?Set the TLS private key file}:/run/tls/key.pem:ro
    depends_on:
      streamlit-web:
        condition: service_healthy
    mem_limit: 512m
    memswap_limit: 512m
    ulimits:
      core: 0
    cpus: 1
    pids_limit: 64
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,nodev,size=128M,mode=0700,uid=10001,gid=10001
      - /run/nginx:rw,noexec,nosuid,nodev,size=1M,mode=0700,uid=10001,gid=10001
    cap_drop: [ALL]
    read_only: true
    security_opt: [no-new-privileges:true]
    logging:
      driver: "none"
    restart: unless-stopped
volumes:
  pilot-logs:
  pilot-control:
  parser-channel:
networks:
  # Actual-host firewall must permit only the reviewed parser IP:2376.
  # Compose alone cannot enforce that destination allowlist.
  parser-engine:
