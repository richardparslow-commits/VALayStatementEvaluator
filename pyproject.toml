[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
# Collect only the real test suite, matching CI (`python -m unittest discover -s tests`).
# Without this, a stray file elsewhere in the tree (editor/macOS duplicate copies of tests
# land next to the originals with a " 2.py" suffix and collide on import) turns a working
# local run into a collection failure.
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
# Strict enough to catch missing hints, but pragmatic for a Streamlit app
ignore_missing_imports = true
# Streamlit's API is highly dynamic; stubs are incomplete
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
show_error_codes = true
# Per-module overrides — tests are allowed looser typing than app code
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = "scripts.*"
disallow_untyped_defs = false
check_untyped_defs = false
disallow_incomplete_defs = false
