name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Static checks (mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install -r requirements-dev.txt

      - name: mypy (strict, app/)
        run: mypy app

  test:
    name: Offline tests + scale simulation
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock

      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v

      - name: Run 2,000-page scale simulation (no API calls)
        run: python scripts/scale_sim.py

  # Gate for the live job below. A job-level `if` may only use the github, needs,
  # vars and inputs contexts — `secrets` is NOT available there. Reading it in a
  # job-level `if` made this whole workflow file invalid, which failed every run
  # in 0 s with no jobs created (not even the lint/test jobs above). The secret is
  # therefore read in a step — `steps.env` may use the secrets context — and
  # published as an output for the job-level `if` to consume.
  live-credentials:
    name: Check LLM credentials
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' }}
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - name: Is OPENAI_API_KEY configured?
        id: check
        env:
          HAS_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
        run: |
          echo "present=$HAS_KEY" >> "$GITHUB_OUTPUT"
          if [ "$HAS_KEY" != "true" ]; then
            echo "OPENAI_API_KEY is not set — skipping the live smoke test."
          fi

  # Live end-to-end run of both pathways against the configured LLM endpoint.
  # Intentionally NOT triggered automatically: it consumes real API credits and
  # requires credentials, so it only runs on manual dispatch and only when the
  # OPENAI_API_KEY secret is configured. Otherwise the job is skipped (never fails).
  smoke:
    name: Live smoke test (LLM endpoint)
    needs: live-credentials
    if: ${{ needs.live-credentials.outputs.present == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL || '' }}
      LLM_MODEL_MAIN: ${{ secrets.LLM_MODEL_MAIN || '' }}
      LLM_MODEL_FAST: ${{ secrets.LLM_MODEL_FAST || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock

      - name: Run live smoke test (Evaluate + Draft)
        run: python scripts/smoke_test.py all
