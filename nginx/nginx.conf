# nginx/nginx.conf — Reverse proxy for VA Lay Statement Evaluator
#
# Provides session affinity (sticky sessions) so each user consistently
# hits the same Streamlit backend. This prevents session loss when the
# user uploads records and runs an evaluation (all state is in-memory
# st.session_state on the pinned backend).
#
# For 100+ concurrent users, consider Pattern C (Redis session store)
# instead — see DEPLOYMENT.md for tradeoffs.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # --- Upstream: all Streamlit replicas ---
    upstream streamlit_backends {
        # ip_hash pins each client IP to a consistent backend.
        # This works well when users come from different IPs (remote teams).
        # For NAT-heavy networks (office LAN), uncomment the sticky cookie
        # method below instead:
        #
        #   sticky cookie srv_id expires=1h domain=.example.com path=/;

        ip_hash;

        server streamlit-web-1:8501;
        server streamlit-web-2:8501;
        server streamlit-web-3:8501;
    }

    # --- Health check for nginx itself ---
    server {
        listen 80;
        server_name _;

        location /nginx-health {
            access_log off;
            return 200 '{"status":"ok","service":"nginx"}';
            add_header Content-Type application/json;
        }

        # --- All Streamlit traffic ---
        location / {
            proxy_pass http://streamlit_backends;

            # Required for Streamlit WebSocket to work through nginx.
            # Streamlit uses WebSockets for live progress updates and
            # rerun triggers — without these headers the UI will not load.
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Long timeout: LLM calls can take minutes for large record sets.
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;

            # Buffering off for streaming responses (progress bar updates).
            proxy_buffering off;

            # Request body size: match Streamlit's maxUploadSize (50 MB default)
            # plus some headroom for multipart overhead.
            client_max_body_size 60m;
        }
    }
}
