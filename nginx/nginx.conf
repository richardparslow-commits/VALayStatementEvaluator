# nginx/nginx.conf — Reverse proxy for VA Lay Statement Evaluator
#
# Provides session affinity (sticky sessions) so each user consistently
# hits the same Streamlit backend. This prevents session loss when the
# user uploads records and runs an evaluation (all state is in-memory
# st.session_state on the pinned backend).
#
# Keep this affinity for 100+ concurrent users too. In Pattern C the fix for hot
# spots is moving the heavy pipeline onto a worker pool (VA_LSE_JOB_QUEUE=1, see
# DEPLOYMENT.md and deploy/k8s/k8s-worker.yaml), NOT dropping affinity: a
# Streamlit session is a live WebSocket bound to one process, so a request routed
# to another pod gets "session not found".
#
# Rate limiting is configured per-client-IP to protect the app from
# request floods. Health probes are exempt. See DEPLOYMENT.md → Rate
# limiting for tuning guidance.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # --- Rate limiting zones (per client IP) ---
    # General: page loads, static assets, health probes.
    limit_req_zone $binary_remote_addr zone=general:10m rate=100r/m;
    # Actions: Evaluate/Draft runs — expensive LLM calls.
    limit_req_zone $binary_remote_addr zone=actions:10m rate=10r/m;
    # Uploads: file ingestion — CPU-bound PDF extraction.
    limit_req_zone $binary_remote_addr zone=uploads:10m rate=20r/m;
    # Return 429 Too Many Requests (not 503).
    limit_req_status 429;

    # --- Upstream: all Streamlit replicas ---
    upstream streamlit_backends {
        # ip_hash pins each client IP to a consistent backend.
        # This works well when users come from different IPs (remote teams).
        # For NAT-heavy networks (office LAN), uncomment the sticky cookie
        # method below instead:
        #
        #   sticky cookie srv_id expires=1h domain=.example.com path=/;

        ip_hash;

        server streamlit-web-1:8501;
        server streamlit-web-2:8501;
        server streamlit-web-3:8501;
    }

    # --- Health check for nginx itself ---
    server {
        listen 80;
        server_name _;

        location /nginx-health {
            access_log off;
            return 200 '{"status":"ok","service":"nginx"}';
            add_header Content-Type application/json;
        }

        # Health probes — never rate-limited (orchestrators need them).
        location /health {
            proxy_pass http://streamlit_backends;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /ready {
            proxy_pass http://streamlit_backends;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # --- All Streamlit traffic ---
        location / {
            limit_req zone=general burst=20 nodelay;

            proxy_pass http://streamlit_backends;

            # Required for Streamlit WebSocket to work through nginx.
            # Streamlit uses WebSockets for live progress updates and
            # rerun triggers — without these headers the UI will not load.
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Long timeout: LLM calls can take minutes for large record sets.
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;

            # Buffering off for streaming responses (progress bar updates).
            proxy_buffering off;

            # Request body size: match Streamlit's maxUploadSize (50 MB default)
            # plus some headroom for multipart overhead.
            client_max_body_size 60m;
        }

        # --- Rate-limited error page ---
        error_page 429 = @rate_limited;
        location @rate_limited {
            default_type application/json;
            return 429 '{"error":"rate_limited","message":"Too many requests. Please wait a moment and try again."}';
        }
    }
}
