worker_processes auto;
events { worker_connections 256; }
http {
    # URL and query logging is disabled: upload URLs can contain identifiers.
    access_log off;
    client_body_temp_path /var/cache/nginx/pilot-upload-body;
    error_log /dev/stderr crit;
    limit_req_zone $binary_remote_addr zone=pilot_requests:10m rate=60r/m;
    limit_conn_zone $binary_remote_addr zone=pilot_connections:10m;
    limit_req_status 429;
    upstream pilot_app { server streamlit-web:8501; }
    server {
        listen 443 ssl;
        ssl_certificate /run/tls/cert.pem;
        ssl_certificate_key /run/tls/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        # Operational endpoints remain private to the app container.
        location = /health { return 404; }
        location = /ready { return 404; }
        location = /metrics { return 404; }
        location / {
            limit_req zone=pilot_requests burst=30 nodelay;
            limit_conn pilot_connections 10;
            # 50 MiB file plus at most 1 MiB multipart framing.
            client_max_body_size 51m;
            proxy_pass http://pilot_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_buffering off;
            # Forward uploads to authenticated admission without disk-spooling first.
            proxy_request_buffering off;
            client_body_timeout 60s;
            proxy_read_timeout 600s;
        }
    }
}
