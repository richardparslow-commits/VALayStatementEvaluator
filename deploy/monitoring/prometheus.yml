# Prometheus scrape configuration for the VA Lay Statement Evaluator.
#
# The app exposes Prometheus text format on the *same* port as its health
# sidecar (VA_LSE_HEALTH_PORT, default 8001 on the web tier, 8002 on workers), so
# there is nothing new to open, secure, or configure beyond the scrape itself.
# A scrape performs no network I/O inside the app (see ADR-011), which is what
# makes a 15s interval safe on an endpoint that shares a port with the liveness
# probe.
#
#   docker compose --profile monitoring up -d      # local stack, this file mounted
#   kubectl apply -f <the ConfigMap generated from this file>   # see README.md
global:
  # 15s matches the app's readiness cache comfortably and keeps the extra load on
  # a web pod negligible (the renderer is a dict walk, not a query).
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    deployment: va-lse

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # --- the app itself: web tier ------------------------------------------
  # Kubernetes: use kubernetes_sd_configs + the prometheus.io/* annotations on
  # the Deployments instead of this static target (the manifests in ../k8s carry
  # them). Static targets below are for Compose and for a single-host install.
  - job_name: va-lse-web
    metrics_path: /metrics
    static_configs:
      - targets: ["web:8001"]
        labels:
          tier: web
    # `?probe=1` would force the one metric that costs a network round trip
    # (remote queue depth). Left off on purpose: a scrape every 15s must not
    # depend on a slow Redis tier. Read it on demand from /health?probe=1 instead.

  # --- Pattern C workers --------------------------------------------------
  # Workers serve the same metrics (job queue, audit backup, phases, LLM) from
  # their own health port. Without this job, a worker-side LLM outage is invisible.
  - job_name: va-lse-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:8002"]
        labels:
          tier: worker

  # --- readiness as an HTTP status, not a metric --------------------------
  # /ready answers 503 when the LLM gateway or a configured model is
  # unreachable. That is a status code, so it is probed, not scraped. The
  # in-app `va_lse_ready` gauge mirrors the *cached* verdict from the
  # orchestrator's probe, but this job is the direct check and works even if
  # nothing else is probing.
  - job_name: va-lse-readiness
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://web:8001/ready"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
