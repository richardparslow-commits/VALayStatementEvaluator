# k8s-redis.yaml — Redis for the Pattern C job queue
#
# Redis here backs the distributed job queue (app/job_queue.py): the queued
# jobs, their progress/status, and their results. It is NOT a session store —
# st.session_state lives in the Streamlit process and cannot be shared, because a
# session is a live WebSocket pinned to one pod. Pattern C removes the *work*
# from the web pod (see k8s-worker.yaml), not the session.
#
# Without this (and without Upstash REST credentials) the app runs the pipeline
# in-process exactly as it always has, and no Redis is needed at all.
#
# See DEPLOYMENT.md → Pattern C for the full setup.
#
# Usage:
#   kubectl apply -f k8s-redis.yaml
#   # Add VA_LSE_REDIS_URL=redis://va-lse-redis:6379/0 and VA_LSE_JOB_QUEUE=1
#   # to your va-lse-env secret
#
# Sizing: size --maxmemory for the job PAYLOADS (extracted record text, not the
# uploaded PDFs) — roughly concurrency x peak batch text. allkeys-lru can evict a
# queued payload, so prefer noeviction or a generous maxmemory once you rely on
# the queue.

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: va-lse-redis
  namespace: va-lse
  labels:
    app: va-lse-redis
spec:
  serviceName: va-lse-redis
  replicas: 1
  selector:
    matchLabels:
      app: va-lse-redis
  template:
    metadata:
      labels:
        app: va-lse-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
              name: redis
          command:
            - redis-server
            - --maxmemory
            - "256mb"
            - --maxmemory-policy
            - allkeys-lru
            - --save
            - "60"
            - "1"
          resources:
            requests:
              memory: 128Mi
              cpu: "0.1"
            limits:
              memory: 512Mi
              cpu: "0.5"
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: redis-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: va-lse-redis
  namespace: va-lse
  labels:
    app: va-lse-redis
spec:
  type: ClusterIP
  selector:
    app: va-lse-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
