# k8s-hpa.yaml — Horizontal Pod Autoscaler for VA Lay Statement Evaluator
#
# Scales between 3 and 20 pods based on CPU utilization.
# When average CPU across pods exceeds 70%, new pods are created.
# When it drops below 50%, pods are scaled down (cool-down: 300s).
#
# Prerequisites: metrics-server must be installed in the cluster.
# Check with: kubectl top nodes

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: va-lse
  namespace: va-lse
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: va-lse
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60        # Add at most 2 pods per minute
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120       # Remove at most 1 pod per 2 minutes
